# Builds the dashboard data from source/ and publishes the site to GitHub Pages.
# Runs when anything is pushed to main (for example a new file uploaded to source/),
# and on demand from the Actions tab ("Run workflow"), where you can also have it
# download the latest Tennessee data from OpenFEMA first.
name: Build and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      download:
        description: "Download the latest Tennessee data from OpenFEMA first"
        type: boolean
        default: false
  # To refresh from OpenFEMA automatically every Monday, remove the # from the next two lines.
  # schedule:
  #   - cron: "17 11 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - name: Download from OpenFEMA
        if: github.event_name == 'schedule' || inputs.download
        run: python scripts/download_openfema.py
      - name: Build data
        run: python scripts/build_data.py
      - name: Save the updated data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A source data js/data-bundle.js downloads
          git diff --staged --quiet || (git commit -m "Update dashboard data" && git push)
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html oauth-callback.html js data downloads _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publishing runs as its own job after the build, as GitHub recommends for deploy-pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
